{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxelle | Page Not Found</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{% static 'image/favicon.svg' %}">
    <link rel="icon" type="image/x-icon" href="{% static 'image/favicon.ico' %}">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            background-color: #F5F2EB;
            color: #1A1A1A;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-wrap {
            max-width: 560px;
            text-align: center;
            padding: 40px 24px;
        }
        .error-brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #1A1A1A;
            margin-bottom: 28px;
        }
        .error-code {
            font-family: 'Playfair Display', serif;
            font-size: 7rem;
            line-height: 1;
            font-weight: 800;
            color: #C9A26A;
            margin: 0;
        }
        .error-line {
            width: 60px;
            height: 2px;
            background-color: #C9A26A;
            margin: 20px auto 24px auto;
        }
        .error-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.7rem;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .error-text {
            font-size: 0.95rem;
            color: #666666;
            line-height: 1.7;
            margin-bottom: 32px;
        }
        .btn-home-lux {
            background-color: #C9A26A;
            color: #1A1A1A;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            text-decoration: none;
            padding: 13px 34px;
            border: 1px solid #C9A26A;
            border-radius: 2px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .btn-home-lux:hover {
            background-color: #b08d5b;
            border-color: #b08d5b;
            color: #1A1A1A;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(201, 162, 106, 0.28);
        }
    </style>
</head>
<body>
    <div class="error-wrap">
        <div class="error-brand">Luxelle</div>

        <h1 class="error-code">404</h1>
        <div class="error-line"></div>

        <h2 class="error-title">This page has wandered off.</h2>
        <p class="error-text">
            The page you're looking for doesn't exist or may have been moved.
            Let's get you back to something beautiful.
        </p>

        <a href="{% url 'home' %}" class="btn-home-lux">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Home
        </a>
    </div>
</body>
</html>
