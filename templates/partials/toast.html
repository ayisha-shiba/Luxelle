{% if messages %}
<div aria-live="polite" aria-atomic="true" class="position-fixed bottom-0 end-0 p-3" style="z-index: 1080;">
    {% for message in messages %}
    <div class="toast align-items-center text-bg-{{ message.tags|default:'dark' }} border-0 mb-2 font-inter shadow-lg" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="4000">
        <div class="d-flex">
            <div class="toast-body d-flex align-items-center gap-2 fw-medium">
                {% if message.tags == 'success' %}
                    <i class="fa-solid fa-circle-check text-lux-gold fs-5"></i>
                {% elif message.tags == 'error' or message.tags == 'danger' %}
                    <i class="fa-solid fa-circle-exclamation text-danger fs-5"></i>
                {% else %}
                    <i class="fa-solid fa-bell text-lux-gold fs-5"></i>
                {% endif %}
                <span class="{% if message.tags == 'success' or message.tags == 'error' or message.tags == 'danger' %}text-lux-black{% else %}text-white{% endif %}">
                    {{ message }}
                </span>
            </div>
            <button type="button" class="btn-close {% if message.tags != 'success' and message.tags != 'error' and message.tags != 'danger' %}btn-close-white{% endif %} me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
    {% endfor %}
</div>

<!-- Custom override style for success & error toasts to look luxurious -->
<style>
    .text-bg-success {
        background-color: #ffffff !important;
        border: 1px solid #e2dfd9 !important;
        border-left: 4px solid #C9A26A !important;
    }
    .text-bg-error, .text-bg-danger {
        background-color: #ffffff !important;
        border: 1px solid #e2dfd9 !important;
        border-left: 4px solid #dc3545 !important;
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        var toastElList = [].slice.call(document.querySelectorAll('.toast'));
        var toastList = toastElList.map(function(toastEl) {
            // Using bootstrap Toast API
            return new bootstrap.Toast(toastEl);
        });
        toastList.forEach(toast => toast.show());
    });
</script>
{% endif %}
