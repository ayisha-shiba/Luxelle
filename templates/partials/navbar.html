<header class="navbar navbar-expand-lg navbar-light bg-white sticky-top py-3 px-4 border-bottom border-light shadow-sm">
    <div class="container-fluid">
        <!-- Brand Logo Left -->
        <a class="navbar-brand font-playfair fs-2 fw-bold tracking-tight text-lux-black m-0" href="{% url 'home' %}">LUXELLE</a>

        <!-- Navbar Toggler for Mobile -->
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#luxNavbar" aria-controls="luxNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Center Navigation Links -->
        <div class="collapse navbar-collapse justify-content-center" id="luxNavbar">
            <ul class="navbar-nav gap-4 mb-2 mb-lg-0 font-inter text-uppercase small tracking-wider fw-medium">
                <li class="nav-item">
                    <a class="nav-link {% if active == 'home' %}active text-lux-black{% else %}text-lux-gray hover-lux-gold{% endif %}" href="{% url 'home' %}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active == 'shop' %}active text-lux-black{% else %}text-lux-gray hover-lux-gold{% endif %}" href="{% url 'product_list' %}">Shop</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active == 'deals' %}active text-lux-black{% else %}text-lux-gray hover-lux-gold{% endif %}" href="{% url 'deals' %}">Deals</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active == 'about' %}active text-lux-black{% else %}text-lux-gray hover-lux-gold{% endif %}" href="{% url 'about' %}">About Us</a>
                </li>
            </ul>
        </div>

        <!-- Right side Utility Icons -->
        <div class="d-flex align-items-center gap-3 px-2 font-inter text-lux-black">
            <a href="{% url 'wishlist' %}" class="text-lux-black text-decoration-none p-1 hover-lux-gold-scale position-relative" title="Favorites">
                <i class="fa-{% if active == 'wishlist' %}solid{% else %}regular{% endif %} fa-heart fs-5"></i>
                <span class="icon-badge{% if not wishlist_count %} d-none{% endif %}" id="wishlistCount">{{ wishlist_count }}</span>
            </a>
            <a href="{% url 'cart' %}" class="text-lux-black text-decoration-none p-1 hover-lux-gold-scale position-relative" title="Shopping Cart">
                <i class="fa-solid fa-bag-shopping fs-5"></i>
                {% if cart_count > 0 %}<span class="icon-badge">{{ cart_count }}</span>{% endif %}
            </a>
{% if request.user.is_authenticated %}
            <div class="dropdown">
                <a href="#" class="text-lux-black text-decoration-none p-1 hover-lux-gold-scale dropdown-toggle no-caret" id="accountDropdown" data-bs-toggle="dropdown" aria-expanded="false" title="Account">
                    <i class="fa-regular fa-user fs-5 {% if active == 'profile' %}text-lux-gold{% endif %}"></i>
                </a>
                <ul class="dropdown-menu dropdown-menu-end border-0 shadow-lg p-3 rounded-3 mt-2" aria-labelledby="accountDropdown">
                    <li><a class="dropdown-item rounded-2 py-2" href="{% url 'profile' %}"><i class="fa-solid fa-user me-2 text-muted"></i>Profile</a></li>
                    <li><a class="dropdown-item rounded-2 py-2" href="{% url 'wallet' %}"><i class="fa-solid fa-wallet me-2 text-muted"></i>Wallet</a></li>
                    <li>
                        <form action="{% url 'logout' %}" method="post" class="d-inline">
                            {% csrf_token %}
                            <button type="submit" class="dropdown-item rounded-2 py-2">
                                <i class="fa-solid fa-right-from-bracket me-2 text-muted"></i>Logout
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
{% else %}
            <a href="{% url 'login' %}" class="btn-login-lux d-inline-flex align-items-center">Login</a>
{% endif %}
        </div>
    </div>
</header>
