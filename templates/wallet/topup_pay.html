{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Money to Wallet | Luxelle</title>
    <link rel="icon" type="image/x-icon" href="{% static 'image/favicon.ico' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">
</head>
<body>
    {% include 'partials/navbar.html' %}

    <div class="container py-5 text-center" style="max-width: 520px;">
        <h1 class="font-playfair fw-bold text-lux-black mb-2">Adding Money to Wallet</h1>
        <p class="text-lux-gray font-inter mb-1">Amount: <span class="fw-bold text-lux-black">₹{{ amount_display }}</span></p>
        <p class="text-lux-gray font-inter mb-4" id="rzp-hint">Opening secure Razorpay checkout…</p>

        <button id="pay-btn" class="luxury-btn text-white text-uppercase tracking-wider px-4 py-3 border-0">
            Pay Now
        </button>
    </div>

    <!-- Hidden form to relay Razorpay response to our callback -->
    <form id="rzp-callback-form" method="POST" action="{% url 'wallet_topup_callback' %}" class="d-none">
        {% csrf_token %}
        <input type="hidden" name="razorpay_order_id"   id="rzp-order-id">
        <input type="hidden" name="razorpay_payment_id" id="rzp-payment-id">
        <input type="hidden" name="razorpay_signature"  id="rzp-signature">
    </form>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        var options = {
            key:      "{{ razorpay_key_id }}",
            amount:   "{{ amount_paise }}",
            currency: "INR",
            name:     "Luxelle",
            description: "Wallet Top-Up",
            order_id: "{{ razorpay_order_id }}",
            handler: function (response) {
                document.getElementById("rzp-order-id").value   = response.razorpay_order_id;
                document.getElementById("rzp-payment-id").value = response.razorpay_payment_id;
                document.getElementById("rzp-signature").value  = response.razorpay_signature;
                document.getElementById("rzp-callback-form").submit();
            },
            prefill: { name: "{{ user_name }}" },
            theme: { color: "#c5a059" },
            modal: {
                ondismiss: function () {
                    window.location.href = "{% url 'wallet' %}";
                }
            }
        };

        var rzp = new Razorpay(options);
        document.getElementById("pay-btn").onclick = function (e) {
            e.preventDefault();
            rzp.open();
        };
        rzp.open(); // auto-open
    </script>
</body>
</html>
